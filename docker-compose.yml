services:
  # Local Bot API server (SPEC §2): the bot receives and sends files up to 2 GB instead of 20 MB.
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from my.telegram.org in .env. Files stay in ./telegram-bot-api.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081" # for the bot started without Docker (scripts/start-mac.sh)
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      BOT_API_DIR: /var/lib/telegram-bot-api
    volumes:
      - ./telegram-bot-api:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    restart: unless-stopped
